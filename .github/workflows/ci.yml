name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Holds the required check open for scenarios that need CI still running (S21); 0 unless the
      # repository variable CI_DELAY_SECONDS is set.
      - run: sleep "${{ vars.CI_DELAY_SECONDS || 0 }}"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  measure:
    # Measures the gzipped web bundle. Acceptance criteria that only CI can verify
    # name this job; it never fails on its own.
    runs-on: ubuntu-latest
    outputs:
      web_bundle_gzip_bytes: ${{ steps.measure.outputs.web_bundle_gzip_bytes }}
      web_bundle_gzip_delta: ${{ steps.measure.outputs.web_bundle_gzip_delta }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: measure
        run: bash scripts/measure
